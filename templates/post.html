<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{summary}}">
  <meta name="theme-color" content="#060810">
  <title>{{title}} | {{site}}</title>
  <link rel="alternate" type="application/rss+xml" title="KANON UFO" href="https://juanbarrero-art.github.io/feed.xml">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
  <meta name="author" content="Juan Barrero (KANON UFO)">
  <meta name="keywords" content="{{keywords}}">
  <link rel="canonical" href="{{canonical}}">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{summary}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogimage}}">
  <meta property="og:site_name" content="{{site}}">
  <meta property="og:locale" content="es_ES">
  <meta property="article:published_time" content="{{date_iso}}">
  <meta property="article:author" content="Juan Barrero">
{{tag_meta}}

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{summary}}">
  <meta name="twitter:image" content="{{ogimage}}">

  <!-- Datos estructurados -->
  <script type="application/ld+json">
{{jsonld}}
  </script>

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../assets/wild.css?v=5">
  <link rel="stylesheet" href="../assets/rootkit.css?v=5">
  <script src="../assets/wild.js?v=5" defer></script>
</head>
<body>
  <canvas id="wild-fondo" aria-hidden="true"></canvas>
  <button class="wild-toggle" type="button">efectos: ON</button>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <div class="contenedor cabecera__interior">
      <a class="marca" href="../index.html" aria-label="{{site}}, inicio">
        <img class="marca__logo" src="../assets/favicon.svg" alt="" width="34" height="34" aria-hidden="true">
        <span class="marca__texto">KANON<span class="marca__acento">_UFO</span></span>
      </a>
      <nav class="nav" aria-label="Navegación principal">
        <ul class="nav__lista">
          <li class="nav__item"><a class="nav__enlace" href="../index.html">Inicio</a></li>
          <li class="nav__item"><a class="nav__enlace" href="index.html">Blog</a></li>
          <li class="nav__item"><a class="nav__enlace" href="../index.html#sobre-mi">Sobre mí</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido" tabindex="-1">
    <article class="post contenedor">
      <p class="post__volver"><a href="index.html">&larr; Todas las entradas</a></p>
      <header class="post__cabecera">
        <p class="post__meta">{{date}} &middot; {{reading}} min de lectura</p>
        {{serie}}
        <h1 class="post__titulo">{{title}}</h1>
        <p class="post__tags">{{tags}}</p>
      </header>
      <div class="post__cuerpo">{{content}}</div>
    </article>
  </main>

  <footer class="pie">
    <div class="contenedor pie__interior">
      <p class="pie__marca">KANON<span class="pie__acento">_UFO</span></p>
      <p class="pie__copy">&copy; <span id="anio">2026</span> {{site}} &middot; hecho con GitHub Pages</p>
    </div>
  </footer>
  <script>document.getElementById('anio').textContent=new Date().getFullYear()</script>
</body>
</html>
