<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="FreshyCalls resuelve el SSN ordenando exports por direccion">
  <rect width="760" height="400" fill="#0b0f1c"/>
  <text x="24" y="34" font-family="Consolas,monospace" font-size="16" fill="#00e5ff">FreshyCalls: el indice ordenado por VA es el SSN</text>

  <!-- unsorted -->
  <text x="24" y="70" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">1) exports Nt* de ntdll (sin orden)</text>
  <g font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">
    <rect x="24" y="80" width="300" height="26" fill="#111a2e" stroke="#1c2440"/><text x="34" y="98">NtQueryInformationProcess  @ 0x...40C0</text>
    <rect x="24" y="106" width="300" height="26" fill="#111a2e" stroke="#1c2440"/><text x="34" y="124">NtClose                    @ 0x...0F90</text>
    <rect x="24" y="132" width="300" height="26" fill="#111a2e" stroke="#1c2440"/><text x="34" y="150">NtAllocateVirtualMemory    @ 0x...1500</text>
    <rect x="24" y="158" width="300" height="26" fill="#111a2e" stroke="#1c2440"/><text x="34" y="176">NtCreateFile               @ 0x...2100</text>
  </g>

  <!-- sort arrow -->
  <path d="M340 130 H400" stroke="#a855f7" stroke-width="3"/>
  <path d="M392 124 l10 6 -10 6" fill="#a855f7"/>
  <text x="336" y="118" font-family="Consolas,monospace" font-size="11" fill="#a855f7">qsort por VA</text>

  <!-- sorted -->
  <text x="420" y="70" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">2) ordenado: indice == SSN</text>
  <g font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">
    <rect x="420" y="80" width="316" height="26" fill="#101a22" stroke="#00e5ff"/><text x="430" y="98">[0x00F] NtClose</text>
    <rect x="420" y="106" width="316" height="26" fill="#101a22" stroke="#00e5ff"/><text x="430" y="124">[0x018] NtAllocateVirtualMemory</text>
    <rect x="420" y="132" width="316" height="26" fill="#101a22" stroke="#00e5ff"/><text x="430" y="150">[0x019] NtQueryInformationProcess</text>
    <rect x="420" y="158" width="316" height="26" fill="#101a22" stroke="#00e5ff"/><text x="430" y="176">[0x055] NtCreateFile</text>
  </g>

  <!-- key point -->
  <rect x="24" y="212" width="712" height="70" rx="10" fill="#0f1424" stroke="#39ff14"/>
  <text x="40" y="238" font-family="Consolas,monospace" font-size="13" fill="#39ff14">NO se leen bytes del stub  -&gt;  inmune a hooks de EDR</text>
  <text x="40" y="262" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">Invariante (Win10/11): los stubs Nt* estan en .text en el mismo orden que sus SSN.</text>

  <!-- oracle -->
  <rect x="24" y="300" width="712" height="72" rx="10" fill="#111a2e" stroke="#ff2d95"/>
  <text x="40" y="326" font-family="Consolas,monospace" font-size="12" fill="#ff2d95">Oraculo independiente: bytes reales del stub</text>
  <text x="40" y="350" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">uf ntdll!NtClose  -&gt;  mov eax, 0Fh   ; coincide con nuestro SSN</text>
</svg>
