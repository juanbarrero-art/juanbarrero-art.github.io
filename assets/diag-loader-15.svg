<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Las cinco fases del mini-loader y sus quince pasos">
  <rect width="900" height="330" fill="#0b0f1c"/>
  <text x="24" y="32" font-family="Consolas,monospace" font-size="16" fill="#00e5ff">La ruta completa: 15 pasos en 5 fases</text>

  <rect x="24" y="60" width="156" height="86" rx="10" fill="#101a22" stroke="#a855f7"/>
  <text x="38" y="86" font-family="Consolas,monospace" font-size="13" fill="#a855f7">1. ENTENDER</text>
  <text x="38" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 1-2</text>
  <text x="38" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">objetivo + taller</text>

  <rect x="198" y="60" width="156" height="86" rx="10" fill="#101a22" stroke="#00e5ff"/>
  <text x="212" y="86" font-family="Consolas,monospace" font-size="13" fill="#00e5ff">2. LEER</text>
  <text x="212" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 3-5</text>
  <text x="212" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">DOS, NT, secciones</text>

  <rect x="372" y="60" width="156" height="86" rx="10" fill="#101a22" stroke="#39ff14"/>
  <text x="386" y="86" font-family="Consolas,monospace" font-size="13" fill="#39ff14">3. MAPEAR</text>
  <text x="386" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 6-8</text>
  <text x="386" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">reservar + copiar + relocs</text>

  <rect x="546" y="60" width="156" height="86" rx="10" fill="#101a22" stroke="#f59e0b"/>
  <text x="560" y="86" font-family="Consolas,monospace" font-size="13" fill="#f59e0b">4. RESOLVER</text>
  <text x="560" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 9-11</text>
  <text x="560" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">imports + .pdata</text>

  <rect x="720" y="60" width="156" height="86" rx="10" fill="#101a22" stroke="#ef4444"/>
  <text x="734" y="86" font-family="Consolas,monospace" font-size="13" fill="#ef4444">5. EJECUTAR</text>
  <text x="734" y="110" font-family="Consolas,monospace" font-size="11" fill="#c9d1e0">pasos 12-15</text>
  <text x="734" y="130" font-family="Consolas,monospace" font-size="10" fill="#8b93b8">entry + cifrar + medir</text>

  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M180 103 H198"/><path d="M190 97 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
    <path d="M354 103 H372"/><path d="M364 97 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
    <path d="M528 103 H546"/><path d="M538 97 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
    <path d="M702 103 H720"/><path d="M712 97 l8 6 -8 6" fill="#3b82f6" stroke="none"/>
  </g>

  <rect x="24" y="190" width="852" height="60" rx="10" fill="#0d1424" stroke="#1c2440"/>
  <text x="40" y="214" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">La regla de oro: cada fase produce algo que la siguiente puede VERIFICAR.</text>
  <text x="40" y="236" font-family="Consolas,monospace" font-size="11" fill="#8b93b8">Si no puedes comprobar que el paso anterior funcionó, no avances: un loader que "casi" funciona es un crash esperando.</text>

  <rect x="24" y="268" width="852" height="42" rx="8" fill="#101a22" stroke="#39ff14"/>
  <text x="40" y="294" font-family="Consolas,monospace" font-size="12" fill="#39ff14">Al final: un PE de 140 KB se ejecuta sin LoadLibrary, con imports resueltos, .pdata registrado y cabeceras borradas.</text>
</svg>
