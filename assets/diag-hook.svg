<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="Hook de EDR en un stub y por que el indirecto no se ve afectado">
  <rect width="760" height="380" fill="#0b0f1c"/>
  <text x="24" y="34" font-family="Consolas,monospace" font-size="16" fill="#00e5ff">Hook de EDR en el stub vs. ejecucion indirecta</text>

  <!-- hooked stub -->
  <rect x="24" y="60" width="340" height="150" rx="10" fill="#1a0f16" stroke="#ff2d95"/>
  <text x="44" y="84" font-family="Consolas,monospace" font-size="13" fill="#ff2d95">Stub HOOKEADO (lo que ve el EDR)</text>
  <text x="44" y="112" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">mov r10, rcx</text>
  <text x="44" y="132" font-family="Consolas,monospace" font-size="12" fill="#ff2d95">jmp EDR_HOOK      ; E9 ..  (o FF 25 ..)</text>
  <text x="44" y="152" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">  mov eax, 0Fh   &lt;-- nunca se ejecuta</text>
  <text x="44" y="172" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">  syscall ; ret  &lt;-- tapado por el hook</text>
  <text x="44" y="196" font-family="Consolas,monospace" font-size="11" fill="#ff2d95">Hell's Gate / Halo's leen estos bytes -&gt; fallan</text>

  <!-- our approach -->
  <rect x="396" y="60" width="340" height="150" rx="10" fill="#0d1a16" stroke="#39ff14"/>
  <text x="416" y="84" font-family="Consolas,monospace" font-size="13" fill="#39ff14">Kagemusha (FreshyCalls + indirect)</text>
  <text x="416" y="112" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">SSN: por orden de exports (no lee el stub)</text>
  <text x="416" y="132" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">Gadget: se busca FUERA del stub hookeado</text>
  <text x="416" y="152" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">Ejecucion: salta al gadget limpio de ntdll</text>
  <text x="416" y="176" font-family="Consolas,monospace" font-size="12" fill="#39ff14">-&gt; el hook no afecta: STATUS_SUCCESS</text>

  <!-- experiments -->
  <rect x="24" y="238" width="712" height="60" rx="10" fill="#0f1424" stroke="#a855f7"/>
  <text x="40" y="264" font-family="Consolas,monospace" font-size="12" fill="#a855f7">Experimento (laboratorio, sin EDR real): hook E9 en copia privada del stub</text>
  <text x="40" y="286" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">KageIsStubHooked = TRUE  -&gt;  FreshyCalls sin cambios  -&gt;  ejecucion indirecta OK</text>

  <text x="24" y="330" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">Honestidad: el kernel sigue viendo la llamada; los hooks de user-mode no son la unica telemetria.</text>
  <text x="24" y="352" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">De 490 exports Nt*, 488 son stubs reales; 2 no (jmp Rtl*). FreshyCalls los tolera.</text>
</svg>
