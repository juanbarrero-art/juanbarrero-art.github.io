<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="Paso de argumentos por aridad y el jmp tail-call">
  <rect width="760" height="380" fill="#0b0f1c"/>
  <text x="24" y="34" font-family="Consolas,monospace" font-size="16" fill="#00e5ff">Aridad: por que un solo jmp sirve para 0 o 6 argumentos</text>

  <!-- registers -->
  <text x="24" y="72" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">Argumentos 1-4: en registros</text>
  <g font-family="Consolas,monospace" font-size="12">
    <rect x="24" y="84" width="90" height="34" rx="6" fill="#101a22" stroke="#00e5ff"/><text x="44" y="106" fill="#c9d1e0">R10*</text>
    <rect x="120" y="84" width="90" height="34" rx="6" fill="#101a22" stroke="#00e5ff"/><text x="146" y="106" fill="#c9d1e0">RDX</text>
    <rect x="216" y="84" width="90" height="34" rx="6" fill="#101a22" stroke="#00e5ff"/><text x="244" y="106" fill="#c9d1e0">R8</text>
    <rect x="312" y="84" width="90" height="34" rx="6" fill="#101a22" stroke="#00e5ff"/><text x="340" y="106" fill="#c9d1e0">R9</text>
  </g>
  <text x="26" y="138" font-family="Consolas,monospace" font-size="11" fill="#8b93b8">* el 1er arg viaja en R10 (lo mueve el stub desde RCX)</text>

  <!-- stack -->
  <text x="430" y="72" font-family="Consolas,monospace" font-size="12" fill="#8b93b8">Argumentos 5+ : en la pila del llamador</text>
  <rect x="430" y="84" width="300" height="120" rx="8" fill="#101a22" stroke="#a855f7"/>
  <g font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">
    <text x="444" y="108">[ rsp + 0x28 ]  arg6</text>
    <text x="444" y="130">[ rsp + 0x20 ]  arg5</text>
    <text x="444" y="152">[ rsp + 0x18 ]  return address</text>
    <text x="444" y="174">[ rsp ]         ...</text>
  </g>

  <!-- jmp preserves -->
  <rect x="24" y="200" width="712" height="72" rx="10" fill="#0d1a16" stroke="#39ff14"/>
  <text x="40" y="226" font-family="Consolas,monospace" font-size="13" fill="#39ff14">El stub termina en jmp (tail call): NO toca la pila</text>
  <text x="40" y="250" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">-&gt; la return address y los args 5+ quedan intactos  -&gt; el ret del gadget vuelve al wrapper</text>

  <!-- verification -->
  <rect x="24" y="288" width="712" height="72" rx="10" fill="#111a2e" stroke="#ff2d95"/>
  <text x="40" y="314" font-family="Consolas,monospace" font-size="12" fill="#ff2d95">Verificado por ejecucion (15 experimentos, Fase 5)</text>
  <text x="40" y="338" font-family="Consolas,monospace" font-size="12" fill="#c9d1e0">Aridad 0: NtYieldExecution  -  Aridad 6: NtAllocateVirtualMemory</text>
</svg>
